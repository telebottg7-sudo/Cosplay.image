name: Extract HTML

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Absolute URL whose HTML should be extracted"
        required: true
        type: string
      output_filename:
        description: "Artifact filename"
        required: false
        default: "page.html"
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Extract HTML
        run: python extract_html.py "${{ inputs.url }}" --output "${{ inputs.output_filename }}"

      - name: Upload extracted HTML
        uses: actions/upload-artifact@v4
        with:
          name: extracted-html
          path: "${{ inputs.output_filename }}"
          if-no-files-found: error
          retention-days: 7
