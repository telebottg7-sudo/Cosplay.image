name: Extract Image URLs

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Absolute URL whose image URLs should be extracted"
        required: true
        type: string
      chunk_size:
        description: "Maximum image URLs per JSON file"
        required: false
        default: "200"
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Extract image URLs
        run: python extract_html.py "${{ inputs.url }}" --output-dir image --chunk-size "${{ inputs.chunk_size }}"

      - name: Upload JSON chunks
        uses: actions/upload-artifact@v4
        with:
          name: image-url-chunks
          path: image/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save JSON chunks to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image/*.json
          if git diff --cached --quiet; then
            echo "No changes to image URL chunks"
          else
            git commit -m "Update extracted image URL chunks"
            git push
          fi
