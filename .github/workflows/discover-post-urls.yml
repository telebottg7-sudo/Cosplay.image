name: Discover Post URLs

on:
  workflow_dispatch:
    inputs:
      category_url:
        description: "Category or archive page URL, for example https://cosplaytele.com/category/byoru/"
        required: true
        type: string

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover post URLs
        run: python discover_posts.py "${{ inputs.category_url }}" --database data/post_urls.json

      - name: Upload URL database
        uses: actions/upload-artifact@v4
        with:
          name: discovered-post-urls
          path: data/post_urls.json
          if-no-files-found: error
          retention-days: 30

      - name: Save URL database to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post_urls.json
          if git diff --cached --quiet; then
            echo "No new post URLs"
          else
            git commit -m "Update discovered post URL database"
            git push
          fi
